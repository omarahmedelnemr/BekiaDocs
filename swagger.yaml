            schema:
              type: object
              required: [orderID, details]
              properties:
                orderID: { type: integer }
                details:
                  type: array
                  items:
                    type: object
                    properties:
                      waste_type: { type: string }
                      weight: { type: number }
      responses:
        '200':
          description: Order marked as picked up

  /worker/mark_declined:
    post:
      tags: [Worker]
      summary: Mark an order as declined by worker
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID]
              properties:
                orderID: { type: integer }
                reason: { type: string }
      responses:
        '200':
          description: Order declined

  /worker/bag/active:
    get:
      tags: [Worker]
      summary: Get the worker's current active waste bag
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active bag or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WasteBagSummary'
                  - type: object
                    nullable: true

  /worker/bag/history:
    get:
      tags: [Worker]
      summary: Get worker's bag history (paginated, filterable by status)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/WasteBagStatus'
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated bag history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WasteBagSummary'

  /worker/assigned_warehouses:
    get:
      tags: [Worker]
      summary: Get warehouses the worker is assigned to
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Warehouse list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WarehouseSummary'

  /worker/bag/initiate_handover:
    post:
      tags: [Worker]
      summary: Initiate bag handover to a warehouse
      description: Bag must be in **HOLDING** status. Sets status to **PENDING_HANDOVER**.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bagID, warehouseID]
              properties:
                bagID: { type: integer }
                warehouseID: { type: integer }
      responses:
        '200':
          description: Bag status set to PENDING_HANDOVER
        '404':
          description: Bag or warehouse not found
        '406':
          description: Bag is not in HOLDING status

  /worker/bag/confirm_handover:
    post:
      tags: [Worker]
      summary: Confirm warehouse weights and complete handover
      description: Bag must be in **CONFIRMING** status. Sets status to **HANDED_OVER**.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bagID]
              properties:
                bagID: { type: integer }
      responses:
        '200':
          description: Bag status set to HANDED_OVER
        '406':
          description: Bag is not in CONFIRMING status

  /worker/bag/refuse_handover:
    post:
      tags: [Worker]
      summary: Refuse warehouse weights — creates ticket, resets bag to HOLDING
      description: |
        Bag must be in **CONFIRMING** status.
        - Creates a **HandoverTicket** with reason `WORKER_REFUSED`
        - Clears `warehouse_received_weight` on all bag items
        - Resets bag to **HOLDING** so worker can try another warehouse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bagID]
              properties:
                bagID: { type: integer }
                notes: { type: string, example: "Weights don't match" }
      responses:
        '200':
          description: Ticket created, bag reset to HOLDING
        '406':
          description: Bag is not in CONFIRMING status

  /worker/calculate_price:
    post:
      tags: [Worker]
      summary: Calculate payout for given waste weights
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderID: { type: integer }
                details:
                  type: array
                  items:
                    type: object
                    properties:
                      waste_type: { type: string }
                      weight: { type: number }
      responses:
        '200':
          description: Calculated price

  /worker/orders_history:
    get:
      tags: [Worker]
      summary: Get worker's completed order history
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated history


openapi: 3.0.3
info:
  title: BekiaPay API
  description: |
    Complete API reference for the BekiaPay platform.

    ## Authentication
    Most endpoints require a Bearer JWT token in the `Authorization` header:
    ```
    Authorization: Bearer <token>
    ```

    ## Permission Levels
    Manager/Staff endpoints are gated by permission type + level:
    - **READ** — can view data
    - **WRITE** — can create/update/delete data
    - **Super** — bypasses all permission checks

    ## Common Responses
    | Status | Meaning |
    |--------|---------|
    | 200 | Success — returns data or `"Done"` |
    | 404 | Not found or missing required parameter |
    | 406 | Business logic error (duplicate, wrong status, etc.) |
  version: "1.0.0"
  contact:
    name: BekiaPay Dev Team

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.bekiapay.com
    description: Production

tags:
  - name: General
    description: Authentication, OTP, role info
  - name: Files
    description: File upload and retrieval
  - name: System
    description: System configuration and cities
  - name: Customer
    description: Customer app — orders, receipts, addresses, profile
  - name: Manager Auth
    description: Manager/staff login and personal profile
  - name: Manager Orders
    description: Order management by staff
  - name: Manager Workers
    description: Worker management — zones, working days, info
  - name: Manager Customers
    description: Customer management by staff
  - name: Manager Staff
    description: Staff accounts and permissions
  - name: Manager Receipts
    description: Receipt management
  - name: Manager Prices
    description: Waste types and pricing management
  - name: Manager Analytics
    description: Dashboard numbers and analytics
  - name: Manager WasteBags
    description: Waste bag tracking
  - name: Manager Affiliate
    description: Affiliate worker applications
  - name: Manager Export
    description: CSV export endpoints
  - name: Worker
    description: Worker app — orders, bags, handover
  - name: B2B Companies
    description: B2B company and branch management
  - name: B2B Orders
    description: B2B order management
  - name: B2B Receipts
    description: B2B receipt management
  - name: B2B Prices
    description: B2B waste pricing
  - name: B2B Zones
    description: B2B zone management
  - name: Warehouse
    description: Warehouse CRUD, prices, workers, bag handover

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Done:
      type: string
      example: "Done"

    Error:
      type: string
      example: "Error message"

    WasteBagStatus:
      type: string
      enum: [HOLDING, PENDING_HANDOVER, CONFIRMING, HANDED_OVER]

    TicketReason:
      type: string
      enum: [WORKER_REFUSED, WAREHOUSE_REJECTED]

    WasteItem:
      type: object
      properties:
        waste_type: { type: string, example: "Plastic" }
        collected_weight: { type: number, example: 4.5 }
        warehouse_received_weight: { type: number, nullable: true, example: 4.2 }

    WarehouseSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        image: { type: string, nullable: true }
        location: { type: string, nullable: true }
        location_link: { type: string, nullable: true }
        zone: { type: string, nullable: true }
        city: { type: string, nullable: true }
        nearby_mark: { type: string, nullable: true }
        contact_person: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }
        active: { type: boolean }
        workers_count: { type: integer }

    WarehouseDetail:
      allOf:
        - $ref: '#/components/schemas/WarehouseSummary'
        - type: object
          properties:
            created_at: { type: string, format: date-time }
            waste_prices:
              type: array
              items:
                $ref: '#/components/schemas/WarehousePrice'
            workers:
              type: array
              items:
                $ref: '#/components/schemas/WorkerSummary'

    WarehousePrice:
      type: object
      properties:
        id: { type: integer }
        waste_type: { type: string, example: "Plastic" }
        price_per_kg: { type: number, example: 7.5 }

    WorkerSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        profile_image: { type: string, nullable: true }
        city: { type: string, nullable: true }

    HandoverTicket:
      type: object
      properties:
        id: { type: integer }
        reason: { $ref: '#/components/schemas/TicketReason' }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        bag:
          type: object
          properties:
            id: { type: integer }
            bag_date: { type: string, format: date }
            status: { $ref: '#/components/schemas/WasteBagStatus' }
            worker:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
        warehouse:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }

    WasteBagSummary:
      type: object
      properties:
        id: { type: integer }
        bag_date: { type: string, format: date }
        status: { $ref: '#/components/schemas/WasteBagStatus' }
        orders_count: { type: integer }
        created_at: { type: string, format: date-time }
        total_price: { type: number, nullable: true }
        worker:
          $ref: '#/components/schemas/WorkerSummary'
        bag_items:
          type: array
          items:
            $ref: '#/components/schemas/WasteItem'
        total_collected: { type: number }

# ─────────────────────────────────────────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────────────────────────────────────────
paths:
  /login:
    post:
      tags: [General]
      summary: Login (all roles)
      security: []
      description: Authenticates a user and returns a JWT. Accepts staff, worker, or customer credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, example: "01012345678" }
                password: { type: string, example: "password123" }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, example: "manager" }
        '404':
          description: Wrong credentials or account not found

  /role_info:
    post:
      tags: [General]
      summary: Get role info from token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
      responses:
        '200':
          description: Role decoded from token
    get:
      tags: [General]
      summary: Get role info from Bearer token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Role info

  /check_phone:
    get:
      tags: [General]
      summary: Check if phone number is registered
      security: []
      parameters:
        - in: query
          name: phone
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Phone status

  /send_otp:
    post:
      tags: [General]
      summary: Send OTP to phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "01012345678" }
      responses:
        '200':
          description: OTP sent

  /verify_otp:
    post:
      tags: [General]
      summary: Verify OTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone: { type: string }
                otp: { type: string, example: "1234" }
      responses:
        '200':
          description: OTP valid, returns token
        '406':
          description: Invalid or expired OTP

  /web_form:
    post:
      tags: [General]
      summary: Submit order from website contact form
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                address: { type: string }
                waste_types: { type: array, items: { type: string } }
      responses:
        '200':
          description: Form received

# ─────────────────────────────────────────────────────────────────────────────
# FILES
# ─────────────────────────────────────────────────────────────────────────────
  /upload:
    post:
      tags: [Files]
      summary: Upload a general file (images, docs)
      security: []
      description: Returns the stored filename. Use this for warehouse images, etc.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Filename stored on server
          content:
            application/json:
              schema:
                type: string
                example: "1712345678_photo.jpg"

  /file/{fileName}:
    get:
      tags: [Files]
      summary: Serve an uploaded file
      security: []
      parameters:
        - in: path
          name: fileName
          required: true
          schema: { type: string }
      responses:
        '200':
          description: File binary

  /uploadProfilePic:
    post:
      tags: [Files]
      summary: Upload a profile picture (requires auth)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile picture filename

  /profilePic/{fileName}:
    get:
      tags: [Files]
      summary: Serve a profile picture
      security: []
      parameters:
        - in: path
          name: fileName
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Image binary

# ─────────────────────────────────────────────────────────────────────────────
# SYSTEM CONFIG
# ─────────────────────────────────────────────────────────────────────────────
  /system_cities:
    get:
      tags: [System]
      summary: Get list of cities served by the system
      security: []
      responses:
        '200':
          description: Array of city names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: ["Cairo", "Alexandria"]

  /version:
    get:
      tags: [System]
      summary: Get current app version
      security: []
      responses:
        '200':
          description: Version string

  /files:
    get:
      tags: [System]
      summary: List all uploaded files
      security: []
      responses:
        '200':
          description: File list

# ─────────────────────────────────────────────────────────────────────────────
# CUSTOMER
# ─────────────────────────────────────────────────────────────────────────────
  /customer/complete_signup:
    post:
      tags: [Customer]
      summary: Complete customer signup (first-time registration)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, packageID, zoneID]
              properties:
                name: { type: string }
                phone: { type: string, example: "01012345678" }
                packageID: { type: integer }
                zoneID: { type: integer }
      responses:
        '200':
          description: Signup complete, returns JWT
        '406':
          description: Customer already exists

  /customer/customer_info:
    get:
      tags: [Customer]
      summary: Get logged-in customer info
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Customer profile

  /customer/order:
    post:
      tags: [Customer]
      summary: Place a new pickup order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addressID: { type: integer }
                waste_types: { type: array, items: { type: integer } }
                pickup_date: { type: string, format: date }
                notes: { type: string }
      responses:
        '200':
          description: Order created

  /customer/active_orders:
    get:
      tags: [Customer]
      summary: Get customer's active orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active orders

  /customer/orders_history:
    get:
      tags: [Customer]
      summary: Get customer's completed/cancelled order history
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Paginated order history

  /customer/order_details:
    get:
      tags: [Customer]
      summary: Get full details of a single order
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: orderID
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Order details

  /customer/cancel_order:
    delete:
      tags: [Customer]
      summary: Cancel an active order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID]
              properties:
                orderID: { type: integer }
      responses:
        '200':
          description: Order cancelled

  /customer/addresses:
    get:
      tags: [Customer]
      summary: Get customer's saved addresses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Address list

  /customer/address:
    post:
      tags: [Customer]
      summary: Add a new address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zoneID]
              properties:
                zoneID: { type: integer }
                notes: { type: string }
      responses:
        '200':
          description: Address added
    delete:
      tags: [Customer]
      summary: Remove an address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressID]
              properties:
                addressID: { type: integer }
      responses:
        '200':
          description: Address removed

  /customer/waste_types:
    get:
      tags: [Customer]
      summary: Get available waste types with icons
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Waste types list

  /customer/waste_prices:
    get:
      tags: [Customer]
      summary: Get current waste prices (public)
      security: []
      responses:
        '200':
          description: Price list per kg

  /customer/pending_receipts:
    get:
      tags: [Customer]
      summary: Get pending payment receipts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending receipts

  /customer/create_receipt:
    post:
      tags: [Customer]
      summary: Create a new receipt/payment request
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Receipt created

  /customer/set_receipt_way:
    post:
      tags: [Customer]
      summary: Set payment method for a receipt
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiptID, methodID]
              properties:
                receiptID: { type: integer }
                methodID: { type: integer }
      responses:
        '200':
          description: Receipt payment method set

  /customer/confirm_order:
    post:
      tags: [Customer]
      summary: Customer confirms order completion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID]
              properties:
                orderID: { type: integer }
      responses:
        '200':
          description: Order confirmed

  /customer/name_edit:
    post:
      tags: [Customer]
      summary: Edit customer name
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Name updated

  /customer/phone_edit:
    post:
      tags: [Customer]
      summary: Edit customer phone number
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPhone]
              properties:
                newPhone: { type: string, example: "01098765432" }
      responses:
        '200':
          description: Phone updated
        '406':
          description: Invalid phone or already used

  /customer/delete_account:
    delete:
      tags: [Customer]
      summary: Delete customer account permanently
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account deleted

  /customer/rate_worker:
    post:
      tags: [Customer]
      summary: Rate a worker after order completion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID, rating]
              properties:
                orderID: { type: integer }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '200':
          description: Rating submitted

  /customer/cities:
    get:
      tags: [Customer]
      summary: Get list of available cities
      security: []
      responses:
        '200':
          description: City list

  /customer/address_zones:
    get:
      tags: [Customer]
      summary: Get address zones (public)
      security: []
      parameters:
        - in: query
          name: city
          schema: { type: string }
      responses:
        '200':
          description: Zone list

# ─────────────────────────────────────────────────────────────────────────────
# MANAGER AUTH & PERSONAL
# ─────────────────────────────────────────────────────────────────────────────
  /manager/login:
    post:
      tags: [Manager Auth]
      summary: Manager/staff login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, example: "01012345678" }
                password: { type: string }
      responses:
        '200':
          description: Login successful, returns JWT
        '404':
          description: Wrong credentials

  /manager/complete_signup:
    post:
      tags: [Manager Auth]
      summary: Complete staff/manager account setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, password, token]
              properties:
                name: { type: string }
                phone: { type: string }
                password: { type: string }
                token: { type: string, description: "Invite token from add_staff" }
      responses:
        '200':
          description: Account created

  /manager/my_info:
    get:
      tags: [Manager Auth]
      summary: Get current logged-in staff info
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Staff profile

  /manager/name_edit:
    post:
      tags: [Manager Auth]
      summary: Edit staff name
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Name updated

  /manager/phone_edit:
    post:
      tags: [Manager Auth]
      summary: Edit staff phone
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200':
          description: Phone updated

  /manager/edit_password:
    post:
      tags: [Manager Auth]
      summary: Change staff password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string }
      responses:
        '200':
          description: Password changed

# ─────────────────────────────────────────────────────────────────────────────
# MANAGER ORDERS
# ─────────────────────────────────────────────────────────────────────────────
  /manager/order_statuses:
    get:
      tags: [Manager Orders]
      summary: Get all order status options
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Status list

  /manager/active_order:
    get:
      tags: [Manager Orders]
      summary: List active orders (filterable)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: workerID
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Active order list

  /manager/order_details:
    get:
      tags: [Manager Orders]
      summary: Get full details for a single order
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: orderID
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Order details

  /manager/assign_order:
    post:
      tags: [Manager Orders]
      summary: Assign order to a worker
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID, workerID]
              properties:
                orderID: { type: integer }
                workerID: { type: string }
      responses:
        '200':
          description: Order assigned

  /manager/decline_order:
    post:
      tags: [Manager Orders]
      summary: Decline/cancel an order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID]
              properties:
                orderID: { type: integer }
                reason: { type: string }
      responses:
        '200':
          description: Order declined

  /manager/mark_ordered:
    post:
      tags: [Manager Orders]
      summary: Mark order as "ordered" (worker on the way)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID]
              properties:
                orderID: { type: integer }
      responses:
        '200':
          description: Status updated

  /manager/mark_processed:
    post:
      tags: [Manager Orders]
      summary: Mark order as processed/completed
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID]
              properties:
                orderID: { type: integer }
      responses:
        '200':
          description: Order marked processed

  /manager/confirm_order:
    post:
      tags: [Manager Orders]
      summary: Confirm order (manager-side approval)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID]
              properties:
                orderID: { type: integer }
      responses:
        '200':
          description: Order confirmed

  /manager/edit_order_details:
    post:
      tags: [Manager Orders]
      summary: Edit order waste type details
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID]
              properties:
                orderID: { type: integer }
                details:
                  type: array
                  items:
                    type: object
                    properties:
                      waste_type: { type: string }
                      weight: { type: number }
      responses:
        '200':
          description: Details updated

  /manager/edit_order_price:
    post:
      tags: [Manager Orders]
      summary: Edit order price manually
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderID, price]
              properties:
                orderID: { type: integer }
                price: { type: number }
      responses:
        '200':
          description: Price updated

  /manager/edit_order_info:
    post:
      tags: [Manager Orders]
      summary: Edit order pickup date
      security:
        - BearerAuth: []
      requestBody:

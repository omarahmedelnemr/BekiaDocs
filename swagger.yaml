                location: { type: string }
                location_link: { type: string }
                zone: { type: string }
                city: { type: string }
                nearby_mark: { type: string }
                contact_person: { type: string }
                contact_phone: { type: string }
                active: { type: boolean }
      responses:
        '200':
          description: Warehouse updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseDetail'
        '404':
          description: Warehouse not found

  /manager/warehouse/set_price:
    post:
      tags: [Warehouse]
      summary: Set (upsert) price per kg for a waste type in this warehouse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseID, waste_type, price_per_kg]
              properties:
                warehouseID: { type: integer }
                waste_type: { type: string, example: "Plastic" }
                price_per_kg: { type: number, example: 7.5 }
      responses:
        '200':
          description: Price upserted
        '404':
          description: Warehouse not found

  /manager/warehouse/initialize_prices:
    post:
      tags: [Warehouse]
      summary: Initialize all missing waste type prices for this warehouse's city
      description: |
        Looks up all WasteTypes for the warehouse's city and creates price entries
        (price_per_kg = 0) for any that don't already exist.
        Returns `{ added: N }` — the number of new entries created.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseID]
              properties:
                warehouseID: { type: integer }
      responses:
        '200':
          description: Prices initialized
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer, example: 4 }
        '404':
          description: Warehouse not found

  /manager/warehouse/assign_worker:
    post:
      tags: [Warehouse]
      summary: Assign a worker to a warehouse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseID, workerID]
              properties:
                warehouseID: { type: integer }
                workerID: { type: string }
      responses:
        '200':
          description: Worker assigned
        '406':
          description: Worker already assigned to this warehouse
        '404':
          description: Warehouse or worker not found

  /manager/warehouse/remove_worker:
    delete:
      tags: [Warehouse]
      summary: Remove a worker from a warehouse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseID, workerID]
              properties:
                warehouseID: { type: integer }
                workerID: { type: string }
      responses:
        '200':
          description: Worker removed
        '404':
          description: Warehouse not found

  /manager/warehouse/pending_bags:
    get:
      tags: [Warehouse]
      summary: Get bags in PENDING_HANDOVER status for this warehouse
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: warehouseID
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: List of pending bags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WasteBagSummary'
        '404':
          description: Warehouse not found

  /manager/warehouse/record_weights:
    post:
      tags: [Warehouse]
      summary: Record received weights per waste type → bag moves to CONFIRMING
      description: |
        - Updates `warehouse_received_weight` on each bag item
        - Computes `total_price = sum(weight × price_per_kg)` using this warehouse's price list
        - Sets `bag.warehouse` and `bag.status = CONFIRMING`
        - Worker must then confirm or refuse the weights
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bagID, warehouseID, received_items]
              properties:
                bagID: { type: integer }
                warehouseID: { type: integer }
                received_items:
                  type: array
                  items:
                    type: object
                    required: [waste_type, warehouse_received_weight]
                    properties:
                      waste_type: { type: string, example: "Plastic" }
                      warehouse_received_weight: { type: number, example: 4.2 }
      responses:
        '200':
          description: Weights recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  bag_id: { type: integer }
                  status: { $ref: '#/components/schemas/WasteBagStatus' }
                  total_price: { type: number, example: 52.5 }
        '404':
          description: Bag or warehouse not found
        '406':
          description: Bag is not in PENDING_HANDOVER status

  /manager/warehouse/reject_bag:
    post:
      tags: [Warehouse]
      summary: Reject a bag at gate — creates ticket, resets bag to HOLDING
      description: |
        Bag must be in **PENDING_HANDOVER** status.
        - Creates a **HandoverTicket** with reason `WAREHOUSE_REJECTED`
        - Resets `bag.status = HOLDING` and `bag.warehouse = null`
        - Worker can then try a different warehouse
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bagID, warehouseID]
              properties:
                bagID: { type: integer }
                warehouseID: { type: integer }
                notes: { type: string, example: "Contaminated waste" }
      responses:
        '200':
          description: Bag rejected, ticket created
        '404':
          description: Bag or warehouse not found
        '406':
          description: Bag is not in PENDING_HANDOVER status

  /manager/warehouse/tickets:
    get:
      tags: [Warehouse]
      summary: Get handover tickets (filterable)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: warehouseID
          schema: { type: integer }
        - in: query
          name: bagID
          schema: { type: integer }
        - in: query
          name: reason
          schema:
            $ref: '#/components/schemas/TicketReason'
      responses:
        '200':
          description: Ticket list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HandoverTicket'
